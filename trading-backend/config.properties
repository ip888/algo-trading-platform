# Alpaca API Configuration — provided at runtime by fly secrets (ALPACA_API_KEY, ALPACA_API_SECRET)
ALPACA_BASE_URL=https://api.alpaca.markets

# Trading Mode
TRADING_MODE=LIVE

# Account Settings
INITIAL_CAPITAL=1

# Dynamic Symbol Selection
BULLISH_SYMBOLS=SPY,QQQ,IWM,AAPL,MSFT,NVDA,GOOGL,GLD
BEARISH_SYMBOLS=SH,PSQ,RWM,DOG,SQQQ
VIX_THRESHOLD=20.0
VIX_HYSTERESIS=2.0

# Broker Enable Flags (explicit opt-in — default false)
TRADIER_ENABLED=false

# Safety Features
# PDT rule abolished by FINRA effective June 4, 2026
PDT_PROTECTION_ENABLED=false
BYPASS_MARKET_HOURS=false

# Position Management
# 3 concurrent positions: at 20% sizing each = 60% of equity deployed ($720 on $1,200 account).
# 5 was set to allow diversification, but with $1,200 it spread capital into $240 × 5 = $1,200
# fully deployed leaving zero reserve, AND created correlated losses (Jul 29: 3 positions all
# long on a down day). 3 concentrated positions ensures capital per trade stays meaningful.
MAX_POSITIONS_AT_ONCE=4
# Reduce max hold time from 48h default to 4h for intraday focus.
# A position that hasn't moved after 4 hours has failed its setup thesis — exit and
# redeploy capital into a fresh setup rather than waiting until EOD.
MAX_HOLD_TIME_HOURS=4
# Reduced from 4h — PDT no longer penalises same-day re-entry
MIN_HOLD_TIME_HOURS=1
# Flat-position time-decay exit: if a position has been held for FLAT_POSITION_HOURS and
# P&L is within ±FLAT_POSITION_THRESHOLD%, exit and redeploy capital into a fresh setup.
# Complements MAX_HOLD_TIME_HOURS (which hard-caps regardless of P&L).
# Tightened 3h/0.25% -> 1.5h/0.4% on 2026-08-26: TP-hit trades resolve in a median of 46min
# (max 99min), but MACD positions were drifting 1.6-5.7h unresolved until the 15:45 EOD
# flatten cut them for a small loss (24 trades, net -$2.96 over 30 days). Old threshold let
# dead capital ride 2+ extra hours before freeing up for a fresh setup.
# Tightened again 1.5h -> 1h on 2026-09-02: 3-day sample (Aug 31-Sep 2, 21 trades) showed
# 10+ of 21 trades resolving at almost exactly the 90min ceiling with near-zero P&L (within
# the 0.4% flat band either way) — essentially a wash, consuming a position slot without
# contributing edge. The trades that actually moved the needle (both winners and losers)
# resolved in under 50 minutes (e.g. META +$5.84 in 50min, META -$1.82 in 2min, URA -$1.88
# in 26min). Shortening to 1h aims to recycle capital out of "going nowhere" positions
# faster, freeing slots sooner for the higher-conviction setups that carry the real edge.
# Watching Thu-Fri 2026-09-03/04 for regressions (e.g. cutting off real moves that just
# needed 60-90min to develop) before deciding whether to keep, revert, or tune further.
TIME_DECAY_EXITS=true
FLAT_POSITION_HOURS=1.0
FLAT_POSITION_THRESHOLD=0.4
# Winner runner: when TP is first hit, sell 50% and lock a profitable stop on the remaining 50%.
# The runner half exits via trailing stop rather than the hard TP, letting strong moves compound.
# RUNNER_LOCK_PCT: fraction of TP distance locked as minimum profit on the runner (0.70 = 70% of TP).
WINNER_RUNNER_ENABLED=true
RUNNER_LOCK_PCT=0.70

# Multi-Profile Trading
# EXPERIMENTAL disabled: fragmented capital on a $1K account leaves $875 idle with 3 positions.
# All capital now in MAIN profile; sizing at 33% deploys 3×$389=$1167 (full utilization).
MULTI_PROFILE_ENABLED=false
MAIN_PROFILE_CAPITAL_PERCENT=100
EXPERIMENTAL_PROFILE_CAPITAL_PERCENT=0

# 19 symbols across uncorrelated sectors/themes:
# broad market (SPY,QQQ), small-cap (IWM), AI/semis single (NVDA), semis basket (SMH), tech (AAPL),
# social/AI (META), gold (GLD), healthcare (XLV), financials (XLF),
# energy broad (XLE), energy E&P (XOP), oil services ETF (OIH), uranium/nuclear (URA), consumer staples (XLP).
# New June 4 2026:
#   AMZN — cloud #1 + AI infra, biggest omission, most liquid mega-cap
#   MSFT — cloud #2 + OpenAI, already in EXPERIMENTAL, now promoted to MAIN
#   ORCL — Oracle cloud/AI turnaround in full swing, no earnings until ~Aug 2026
#   AMD  — was in MOMENTUM_ASSETS but missing from MAIN_BULLISH_SYMBOLS
# IWM removed: 10 trades, 30% win rate, -$5.76 net (Aug 12 2026). Correlated with SPY/QQQ but worse executions.
# SMH removed: 5 trades, 20% win rate, -$3.95 net. Semiconductor basket too volatile for 1% SL.
# AMZN removed: 3 trades, 0% win rate, -$1.95 net. Wide spreads eat edge on fractional sizes.
MAIN_BULLISH_SYMBOLS=SPY,QQQ,NVDA,AAPL,META,MSFT,ORCL,AMD,GLD,XLV,XLF,XLE,XOP,OIH,URA,XLP
MAIN_BEARISH_SYMBOLS=SH,PSQ,RWM,DOG,SQQQ

# VIX-scaled TP is now the active TP mechanism (getVixScaledTakeProfit: clamp(VIX*0.075, 0.60, 1.50)).
# This baseline is the fallback for ATR-based TP in handleBuy and EXPERIMENTAL profile (no VIX scaling).
MAIN_TAKE_PROFIT_PERCENT=1.4
# Tighter stop viable — same-day re-entry is penalty-free post-PDT
MAIN_STOP_LOSS_PERCENT=1.0
MAIN_TRAILING_STOP_PERCENT=1.2

# DELL added: AI server hardware story (PowerEdge), test in EXPERIMENTAL before MAIN
# ORCL,AMZN added to EXPERIMENTAL too for cross-profile tracking
EXPERIMENTAL_BULLISH_SYMBOLS=SPY,QQQ,DIA,GLD,SLV,TLT,XLU,XLP,XLV,XLE,XLK,XLF,AAPL,MSFT,ORCL,DELL
EXPERIMENTAL_BEARISH_SYMBOLS=VXX,UVXY,VIXY,TBT
EXPERIMENTAL_TAKE_PROFIT_PERCENT=0.8
EXPERIMENTAL_STOP_LOSS_PERCENT=0.6
EXPERIMENTAL_TRAILING_STOP_PERCENT=1.0

# Risk Management
MAX_LOSS_EXIT_ENABLED=true
MAX_LOSS_PERCENT=2.5
# Daily realized-loss circuit breaker: block new entries once intraday losses exceed 1.5% of equity.
# Default code value was 3.0% — too wide for this account size (~$35 on $1,184 account).
# 1.5% = ~$18 cap. Prevents compounding a bad day (June 17: overnight bug + URA + SMH = -$12).
DAILY_MAX_LOSS_ENABLED=true
DAILY_MAX_LOSS_PERCENT=1.5

# ── Inverse ETF / bearish entry guards ─────────────────────────────────────
# STRONG_BEAR regime can fire from stale overnight breadth data even when VIX
# is calm (e.g. VIX=13 on June 25).  Real bear markets always have elevated VIX.
# These three settings prevent wrong-direction inverse ETF trades in a calm market.
#
# Min VIX to allow any inverse ETF (SQQQ, SH, PSQ, RWM, DOG) entry in STRONG_BEAR.
# Below this threshold the entry is blocked regardless of regime.
BEAR_ENTRY_VIX_MINIMUM=20
#
# Minutes the STRONG_BEAR regime must be active *during market hours* before the
# first inverse ETF entry is allowed.  Prevents reacting to a regime flip that
# appears at open from overnight stale data and then flips back within minutes.
BEAR_ENTRY_PERSISTENCE_MINUTES=30
#
# Minimum regime-detector confidence (0.0-1.0) required to act on the regime.
# Below this the bot uses RANGE_BOUND as a safe fallback instead.
REGIME_MIN_CONFIDENCE=0.55
# VIX minimum for new entries: below this level daily ranges are too tight for the TP to be reachable.
# At VIX<11 (extreme complacency) the expected intraday move is <0.5%, no room to run.
# VIX=11-13 still has 0.5-1% daily moves on individual names — allow entries, rely on VIX-scaled TP/SL.
# Scalp entries are exempt (they use their own tight SL/TP and are not affected by this gate).
VIX_ENTRY_GATE_ENABLED=true
VIX_ENTRY_MINIMUM=10.0
# Lunch blackout: block new swing entries during the low-directional midday period.
# Core dead zone is 12:00-13:30; cutting the full 11:30-14:30 block was too aggressive —
# it combined with the VIX gate and EOD cutoff to leave zero swing entry windows at VIX<13.
# Scalp and existing-position management are not affected.
LUNCH_BLACKOUT_ENABLED=true
LUNCH_BLACKOUT_START=12:00
LUNCH_BLACKOUT_END=13:30
# Correlation cap: block entry if new symbol correlates ≥0.60 with 3+ existing positions.
# Was 2 — but most liquid tech (SPY/QQQ/NVDA/AAPL/META) all correlate >0.60, so cap=2 allowed
# only 1 correlated position at a time, effectively preventing 3 concurrent entries and leaving
# 40%+ of capital idle. Cap=3 still prevents the 5-way pile-up from Aug 6 2026.
CORRELATION_CAP_THRESHOLD=0.60
CORRELATION_CAP_MAX_CONCURRENT=3
# Market breadth filter: minimum ratio of advancing stocks required to enter new trades.
# 40% (old default) was too strict — individual mega-cap stocks (MSFT, AMD) can be in strong
# uptrends while breadth is 25% due to sector rotation. SMA-20 filter already blocks
# stocks that are genuinely in downtrends. Using 20% to only block genuine market crashes.
MIN_BREADTH_RATIO=0.20

# Move stop to entry price once position gains 0.5% — position can never turn into a loss
# Critical for unclear/choppy markets: locks in "at worst flat" once trade moves our way
BREAKEVEN_STOP_ENABLED=true
BREAKEVEN_TRIGGER_PERCENT=0.20

# Re-entry gate after any exit: 90min — prevents rapid whipsaw re-entry.
# Was 3h — too long: stop at 10am + lunch blackout 12-13:30 = blocked all afternoon.
# With 45-min opening window + 90min cooldown, at most 2-3 entries per symbol per session.
STOP_LOSS_COOLDOWN_MS=5400000
# Per-symbol post-loss cooldown: 6h for first loss (same-day excluded), 12h after 2+ consecutive losses
# 3h was too short: NVDA stopped out at 10:21am, 3h expired at 1:21pm, bot re-entered at 1:22pm into
# the same downtrend and stopped out again (Aug 10 2026). 6h = loss at 10am → blocked until 4pm.
# 12h extended = consecutive losses block next morning too (prevents reopening a broken symbol).
# 6h → 2h: don't forfeit the afternoon after one morning loss
POST_LOSS_COOLDOWN_MS=7200000
# 12h → 4h: 2+ consecutive losses extend cooldown to rest of session
POST_LOSS_COOLDOWN_EXTENDED_MS=14400000

# Momentum Strategy Parameters
# SPY,QQQ,IWM REMOVED: broad market index ETFs are not independent momentum assets — they move
# WITH the market. In WEAK_BEAR, including them bypasses strict routing and causes entries in a
# declining market (IWM -0.75% on Jul 20 2026). Non-momentum label means WEAK_BEAR strict routing
# blocks them for new entries. In STRONG_BULL/WEAK_BULL they still trade via MACD.
# OIH added: oil services ETF in momentum list — high intraday momentum when crude moves
# AMZN,MSFT,ORCL added: cloud/AI momentum plays with consistent multi-week trends
MOMENTUM_ASSETS=GLD,SLV,TLT,XLU,NVDA,TSLA,META,AMD,XLE,XLK,XOP,URA,GRID,OIH,MSFT,ORCL
# Inverse/short ETFs allowed in WEAK_BEAR and STRONG_BEAR regimes.
# These profit from market decline — bypass the long-only strict routing in WEAK_BEAR.
INVERSE_ETF_SYMBOLS=SH,PSQ,RWM,DOG,SQQQ
# RSI buy window widened 60→65: broad market ETFs trend-continue at RSI 60-65, not just below 60
MOMENTUM_RSI_BUY_MIN=45.0
MOMENTUM_RSI_BUY_MAX=65.0
MOMENTUM_RSI_SELL_THRESHOLD=72.0
MOMENTUM_MIN_PERCENT=0.5
# Was raised 0.8→1.2 in the Jul 28 audit (wrong direction): in VIX=12 environment, 1.2% 10-bar
# momentum requires explosive moves and effectively disables the strategy. Lowered to 0.5%:
# a stock moving 0.5% over 10 bars in a WEAK_BULL regime is a legitimate momentum signal.
# Confirmation bars reduced 4→3: 4 consecutive bars of >0.2% momentum was too strict, missing valid setups
MOMENTUM_CONFIRMATION_BARS=3
MOMENTUM_MAX_ATR_PERCENT=2.0
# SMA headroom: individual momentum names (NVDA, META, SMH) routinely run 5-8% above SMA in bull trends
# 3% was too tight and blocked NVDA all day on June 4 despite 77% MTF BUY signal
MOMENTUM_MAX_ABOVE_SMA_PERCENT=5.0

PORTFOLIO_STOP_LOSS_ENABLED=true
PORTFOLIO_STOP_LOSS_PERCENT=3.0

# Advanced Features
REGIME_DETECTION_ENABLED=true
MULTI_TIMEFRAME_ENABLED=true
# 1 = daily trend confirming is sufficient; 15M used for entry timing
# 2 (old default) blocked all entries in slow grind-up markets
MULTI_TIMEFRAME_MIN_ALIGNED=1
# FIXED sizing: allocate a flat percentage of equity per trade regardless of Kelly stats.
# Kelly needs 100+ trades of calibrated win-rate history to be reliable; with only 12 trades
# it amplifies random variance and produced $16-40 positions on a $1,200 account (Jul 28-31).
# FIXED=0.25 → $263/trade at $1,054 → 4 positions = ~100% equity deployed.
# Switch back to KELLY after 50+ trades in each regime produce stable win-rate estimates.
POSITION_SIZING_METHOD=FIXED
# 25%: 4 × 25% = 100% equity deployed when all slots filled — maximizes capital utilization.
# DAILY_MAX_LOSS_PERCENT=1.5% circuit breaker limits downside if multiple positions stop out.
POSITION_SIZING_FIXED_PERCENT=0.25
# Afternoon sizing matches morning — no reason to penalize afternoon with smaller positions.
# The MACD/ORB signal quality doesn't degrade in the afternoon; spreads on SPY/QQQ/NVDA stay tight.
POSITION_SIZING_AFTERNOON_PERCENT=0.25
# POSITION_SIZING_MAX_PERCENT was never set here, so AdvancedPositionSizer.calculatePositionSize()
# was silently capping every position at its hardcoded 0.20 default — undoing the "FIXED is the
# authoritative number" intent above (the ADAPTIVE/ATR/VOLATILITY disables all around this block
# only matter if this cap actually matches FIXED_PERCENT). Set explicitly to stop the silent override.
POSITION_SIZING_MAX_PERCENT=0.25
# FIXED means fixed — disable VIX-based volatility multiplier that was cutting positions by 70%.
# Formula: 1/(1 + VIX/100 × 20). At VIX=12: 1/(1+2.4) = 0.294× → 20% becomes 5.9%.
# Root cause of AAPL entering at 0.22 shares instead of 0.71 shares (Aug 3 2026).
POSITION_SIZING_VOLATILITY_ADJUST_ENABLED=false
# Disable ML-based adaptive sizing: the untrained ML model (< 30 trades) was further reducing
# FIXED positions by another 40-60%, producing $16 positions. No data = no signal.
ADAPTIVE_SIZING_ENABLED=false
# Disable ATR vol-targeted sizing override when using FIXED method.
# This Tier 1.3 calculation (equity × risk% / stop_distance) can cap FIXED positions below
# the configured percentage. FIXED sizing is the authoritative number — ATR stops are kept
# but they must not override the position count.
ATR_SIZING_ENABLED=false
# Disable ATR-based stop-loss calculation. ATR stops default ON and silently override the
# configured flat SL%: at VIX=11 the 14-day ATR on daily bars is ~1.6% per bar, so a 2× ATR
# stop = 3.2% — 3× wider than the configured 1.0% SL. This lets losing positions bleed -3%
# before the bot's own P&L monitor triggers, defeating the 1% risk-per-trade design.
# Keep flat SL% (MAIN_STOP_LOSS_PERCENT=1.0) as the authoritative stop.
ATR_STOPS_ENABLED=false
# Volume profile check uses top-3 highest-volume 15-min bars as support nodes (threshold 1.5%).
# In a sustained WEAK_BULL uptrend, current price moves away from those past volume nodes,
# so the filter always rejects valid trend entries. SMA-20 + RSI gates already guard against
# chasing (Aug 3 2026: MSFT BUY blocked until this was disabled).
VOLUME_PROFILE_ENABLED=false
ALPHA_VANTAGE_ENABLED=false
ALPHA_VANTAGE_API_KEY=placeholder

# Rate Limiting
API_REQUEST_DELAY_MS=300
SYMBOL_BATCH_SIZE=6
ENABLE_ADAPTIVE_RATE_CONTROL=true

# Symbol blacklist — never trade these symbols regardless of strategy signals.
# Covers IPOs/secondaries with broker restrictions (no fractional, no margin, IPO mechanics).
SYMBOL_BLACKOUT=

# Lock intraday profits at EOD — free to re-enter fresh next morning post-PDT
EOD_EXIT_ENABLED=true
# Moved 15:30→15:45: positions entered at 14:00 scalp window need 45+ min to mature.
# EOD entry cutoff (15 min before) = 15:30, which is after the scalp window (14:00-15:00).
# Force close all remaining positions at 15:45 — 15 min before close gives time for fills.
EOD_EXIT_TIME=15:45
# Per-strategy EOD entry cutoffs:
# MAIN strategy: 45 min before EOD (15:00 with 15:45 exit).
#   VIX-scaled TP formula: clamp(VIX × 0.075, 0.60, 1.50). At VIX=11-12 → TP ≈ 0.83%.
#   A 0.83% move takes 30-45 min in STRONG_BULL; 45 min allows entering until 15:00.
#   75-min cutoff (14:30) combined with 12:00-13:30 lunch blackout left only 13:30-14:30
#   (60 min) of afternoon swing window — too narrow. 45 min opens 13:30-15:00 (90 min).
# SCALP strategy: exempt from this cutoff — 0.40% TP is achievable in minutes; scalp already
#   controls its own 14:00–15:00 afternoon window.
MAIN_EOD_ENTRY_CUTOFF_MINUTES=45
EOD_PROFIT_LOCK=false

SMART_CAPITAL_RESERVE_PERCENT=0.01

# Open-window gate: block new entries during first 45 minutes after open (9:30–10:15 ET).
# 15 min was too short — allowed IWM/AAPL/SPY entries at 9:45 AM ET, the most volatile
# post-auction period, causing losses (Jul 14 2026: IWM -$1.21 at 9:45).
# 30 min was also too tight — all three Jul 29 2026 losses entered at exactly 10:00-10:01 ET,
# the 30-min boundary, on a pre-FOMC down day where the opening trend was still unconfirmed.
# Raised to 45 min so MACD/momentum require a trend that has held for >40 minutes before entry.
# Scalp strategy uses its own window check (9:45–11:30 AM); this gate does not affect scalp.
NO_TRADE_OPEN_WINDOW_MINUTES=45

# Intraday Scalp Strategy (post-PDT, uses 15-min bars)
# Windows: 9:45–11:30 AM ET (morning momentum) and 14:00–15:00 ET (afternoon momentum)
# Entry: RSI crosses above 50, price above VWAP, volume > 1.1× average
# Volume multiplier lowered 1.3→1.1: VIX=12 environment has structurally lower volume;
# 1.3× was blocking every scalp on calm days (observed Jul 27-28 2026, 0 scalp trades).
# DISABLED 2026-09-05: full week's data (Aug 31-Sep 4, 11 trades) showed scalp running well
# below its own breakeven math. Risk/reward is 0.25% stop vs 0.40% target, which needs a 38.5%
# win rate just to break even — actual was 27.3%, and none of the 11 trades hit take-profit at
# all (every "win" was a near-flat scalp-timeout/EOD close, not a real target hit). The two
# genuinely good days this week (Mon/Tue) had zero scalp trades; scalp lost money on 2 of the
# 3 days it fired (Thu -$1.85, Fri -$1.90). This isn't a threshold miscalibration — the entry
# signal (RSI cross + VWAP + volume) isn't reliably predicting even a small continued move at
# these thresholds. Paused pending a rework of the entry logic, not just a number tweak.
SCALP_STRATEGY_ENABLED=false
# High-liquidity symbols always scanned for scalp every cycle (not subject to 6-symbol batch rotation).
# SPY/QQQ/IWM: tightest spreads, deepest liquidity — best for 0.40% micro-targets.
# NVDA,AAPL,META,MSFT,AMD,TSLA: high intraday momentum, frequent VWAP crosses.
SCALP_SYMBOLS=SPY,QQQ,IWM,NVDA,AAPL,META,MSFT,AMD,TSLA
SCALP_STOP_LOSS_PERCENT=0.25
SCALP_TAKE_PROFIT_PERCENT=0.40
SCALP_MAX_DAILY_TRADES=15
SCALP_RSI_MIN=40.0
SCALP_RSI_MAX=62.0
SCALP_VOLUME_MULTIPLIER=0.5
# Scalp has no exit of its own faster than the general 4h absolute hold cap and EOD flatten —
# added 2026-09-03 after a live scalp position (IWM) rode 89 minutes never hitting its tight
# 0.25%/0.40% SL/TP band, only caught because it happened to be near EOD. A scalp entry that
# hasn't resolved in 45 minutes has failed its fast-momentum thesis; force-close and free the
# slot rather than let it drift toward the swing-trade-scale backstops.
SCALP_MAX_HOLD_MINUTES=45

# Economic calendar blackout — FOMC only. CPI/PCE/NFP rarely gap large-cap tech by 1.5%
# and blocking them costs more opportunity than the risk they prevent.
# Pre-FOMC kept: Jul 29 2026 showed institutions hedge the session before a Fed meeting.
ECONOMIC_BLACKOUT_ENABLED=true
ECONOMIC_BLACKOUT_DATES=2026-09-16,2026-09-17,2026-10-29,2026-11-04,2026-11-05
