name: CI - Java and Dashboard

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java-tests:
    name: Java 25 Maven tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APCA_API_KEY_ID: ci-dummy-key-not-valid
      APCA_API_SECRET_KEY: ci-dummy-secret-not-valid
      APCA_API_BASE_URL: https://127.0.0.1:1
    defaults:
      run:
        working-directory: trading-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: trading-backend/pom.xml
      - name: Run Java tests
        run: mvn -B -ntp clean test
      - name: Upload Java test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-results
          path: trading-backend/target/surefire-reports/
          if-no-files-found: ignore

  dashboard-tests:
    name: Dashboard lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: trading-backend/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: trading-backend/dashboard/package-lock.json
      - name: Install dependencies
        id: dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        if: success() || (failure() && steps.dependencies.outcome == 'success')
        run: npm run test:run
      - name: Production build
        if: success() || (failure() && steps.dependencies.outcome == 'success')
        run: npm run build
